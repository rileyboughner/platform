services:
  class:
    image: nginx:alpine
    container_name: class
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - /mnt/tank/services/class/index.html:/usr/share/nginx/html/index.html:ro
      - /mnt/tank/services/class/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy_net
networks:
  proxy_net:
    external: true
