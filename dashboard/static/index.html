<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/static/theme-variables.css?v=2">
  <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
  <header class="page-header">
    <h1>Dashboard</h1>
    <div class="header-right">
      <span id="last-updated" class="muted"></span>
      <button id="logout-btn" type="button" class="logout-btn">Log out</button>
    </div>
  </header>

  <main class="grid">
    <section class="card card-wide" id="card-server">
      <h2>Server</h2>
      <div class="card-body loading">Loading…</div>
    </section>

    <section class="card card-wide" id="card-services">
      <h2>Services</h2>
      <div class="card-body loading">Loading…</div>
    </section>

    <section class="card card-wide" id="card-seerr">
      <h2>Requests</h2>
      <div class="card-body loading">Loading…</div>
    </section>
  </main>

  <script src="/static/app.js?v=7"></script>
</body>
</html>
