enable_audio_bell no
confirm_os_window_close 0
include ~/.cache/wal/colors-kitty.conf

mouse_hide_wait -1.0
allow_remote_control yes
# Each `kitty` launch (regular windows + pyprland scratchpads) is a
# separate process, so a single shared socket path would only bind to
# the first one; {kitty_pid} gives every instance its own socket so the
# theme switcher can broadcast `set-colors` to all of them at once.
listen_on unix:/tmp/kitty-{kitty_pid}

font_size 14
