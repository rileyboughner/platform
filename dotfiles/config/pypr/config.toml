[pyprland]
plugins = ["scratchpads"]

[scratchpads.term]
command = "kitty --directory ~ --class kitty-dropterm"
class = "kitty-dropterm"
size = "92% 88%"
position = "4% 40px"
animation = ""
lazy = true

[scratchpads.term2]
command = "kitty --directory ~ --class kitty-dropterm2"
class = "kitty-dropterm2"
size = "92% 88%"
position = "4% 40px"
animation = ""
lazy = true

[scratchpads.claude]
command = "vivaldi --app=https://claude.ai"
class = "vivaldi-claude.ai__-Default"
size = "92% 92%"
position = "4% 40px"
animation = ""
process_tracking = false
lazy = true

[scratchpads.homeassistant]
command = "vivaldi --app=https://home.rileyboughner.dev"
class = "vivaldi-home.rileyboughner.dev__-Default"
size = "92% 92%"
position = "4% 40px"
animation = ""
process_tracking = false
lazy = true

[scratchpads.zoho]
command = "vivaldi --app=https://mail.zoho.com"
class = "vivaldi-mail.zoho.com__-Default"
size = "92% 92%"
position = "4% 40px"
animation = ""
process_tracking = false
lazy = true

[scratchpads.outlook]
command = "vivaldi --app=https://outlook.office.com"
class = "vivaldi-outlook.office.com__-Default"
size = "92% 92%"
position = "4% 40px"
animation = ""
process_tracking = false
lazy = true

[scratchpads.todo]
command = "kitty --class kitty-todo -e $HOME/.platform/dotfiles/scripts/todo tui"
class = "kitty-todo"
size = "92% 88%"
position = "4% 40px"
animation = ""
lazy = false

[scratchpads.calendar]
command = "vivaldi --app=https://calendar.google.com"
class = "vivaldi-calendar.google.com__-Default"
size = "92% 92%"
position = "4% 40px"
animation = ""
process_tracking = false
lazy = true

[scratchpads.messages]
command = "vivaldi --app=https://messages.google.com/web/conversations"
class = "vivaldi-messages.google.com__web_conversations-Default"
size = "92% 92%"
position = "4% 40px"
animation = ""
process_tracking = false
lazy = true
