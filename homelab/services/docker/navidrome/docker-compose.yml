services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    networks:
      - proxy_net
    ports:
      - 4533:4533
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/navidrome/data:/data
      - ${MEDIA_DIRECTORY}/music:/music:ro

networks:
  proxy_net:
    external: true
    name: proxy_net
