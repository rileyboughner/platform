services:
  minecraft-modded:
    image: itzg/minecraft-server:latest
    container_name: minecraft-modded
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25566:25565"
    volumes:
      - ${SERVICE_DIRECTORY}/minecraft-modded/data:/data
    # whitelist.json intentionally lives inside the data directory above, not as a
    # separate bind mount: see minecraft/docker-compose.yml for why.
    environment:
      - EULA=TRUE
      - TYPE=MODRINTH
      - MODRINTH_MODPACK=/data/pack.mrpack
      - MEMORY=10G
      - TZ=America/NewYork
      - MOTD=modded - have fun!
      - DIFFICULTY=hard
      - MAX_PLAYERS=100
      - ENABLE_WHITELIST=TRUE
      - ONLINE_MODE=TRUE
      - USE_AIKAR_FLAGS=TRUE
      - VIEW_DISTANCE=12
      - SIMULATION_DISTANCE=10
      - MAX_TICK_TIME=300000
      - MODRINTH_PROJECTS=chunky
