networks:
  arr_net:
    name: arr_net
  gluetun:
    driver: bridge

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=ipvanish
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - SERVER_COUNTRY=United States
    ports:
      - 8082:8080
      - 9091:9091
      - 6881:6881
      - 6881:6881/udp
    networks:
      - gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${SERVICE_DIRECTORY}/qbittorrent:/config
      - ${MEDIA_DIRECTORY}/torrents:/torrents
    restart: unless-stopped
    depends_on:
      - gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - gluetun
      - arr_net
    depends_on:
      - gluetun

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/sonarr:/config
      - ${MEDIA_DIRECTORY}/shows:/shows
      - ${MEDIA_DIRECTORY}/torrents:/torrents
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - gluetun
      - arr_net
    depends_on:
      - gluetun

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/radarr:/config
      - ${MEDIA_DIRECTORY}/movies:/movies
      - ${MEDIA_DIRECTORY}/torrents:/torrents
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - gluetun
      - arr_net
    depends_on:
      - gluetun

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/lidarr:/config
      - ${MEDIA_DIRECTORY}/music:/music
      - ${MEDIA_DIRECTORY}/torrents:/torrents
    ports:
      - 8686:8686
    restart: unless-stopped
    networks:
      - gluetun
      - arr_net
    depends_on:
      - gluetun

  readarr:
    image: ghcr.io/iuliandita/readarr:0.4.36
    container_name: readarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/readarr:/config
      - ${MEDIA_DIRECTORY}/audiobooks:/audiobooks
      - ${MEDIA_DIRECTORY}/torrents:/torrents
    ports:
      - 8787:8787
    restart: unless-stopped
    networks:
      - gluetun
      - arr_net
    depends_on:
      - gluetun

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: "1000:1000"
    networks:
      - arr_net
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${SERVICE_DIRECTORY}/jellyseer:/app/config
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      - arr_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${SERVICE_DIRECTORY}/jellyfin/config:/config
      #- ${SERVICE_DIRECTORY}/jellyfin/cache:/cache
      - ${MEDIA_DIRECTORY}:/media
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped

